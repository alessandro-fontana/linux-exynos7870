%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/dongwoon,dw9807-vcm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Dongwoon Anatech DW9807 voice coil lens driver

maintainers:
  - Sakari Ailus <sakari.ailus@linux.intel.com>

description: |
  DW9807 is a 10-bit DAC with current sink capability. It is intended for
  controlling voice coil lenses.

properties:
  compatible:
    const: dongwoon,dw9807-vcm

  reg:
    maxItems: 1

  vdd-supply:
    description: Power supply of the device.

  dongwoon,sac-mode:
    description:
      Enables the ringing control and selects the Smart Actuator Control
      mode, MODE[7:5]; direct mode when absent.
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 7

  dongwoon,vcm-prescale:
    description: Prescaler of the SAC period, MODE[2:0].
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 7
    default: 0

  dongwoon,sac-timing:
    description: SAC period, 6.3 ms + value * 0.1 ms.
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 0x3f
    default: 0x20

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        lens@e {
            compatible = "dongwoon,dw9807-vcm";
            reg = <0x0e>;
        };
    };
...
